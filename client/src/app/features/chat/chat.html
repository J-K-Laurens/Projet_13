<div style="max-width: 600px; margin: 40px auto; font-family: sans-serif;">

  <!-- Formulaire de connexion, affiché tant qu'on n'est pas connecté -->
  <div *ngIf="!isConnected">
    <h2>Rejoindre le chat</h2>

    <label for="senderName">Votre nom :</label>
    <input id="senderName" [(ngModel)]="senderName" placeholder="Ex : Alice" />

    <br /><br />

    <label for="senderType">Votre rôle :</label>
    <select id="senderType" [(ngModel)]="senderType">
      <option value="user">Client</option>
      <option value="agent">Agent support</option>
    </select>

    <br /><br />

    <label for="inputSessionId">Session ID (optionnel - pour rejoindre une session existante) :</label>
    <input 
      id="inputSessionId" 
      [(ngModel)]="inputSessionId" 
      placeholder="Laisser vide pour créer une nouvelle session" 
    />

    <br /><br />

    <button (click)="join()" style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
      Rejoindre
    </button>
  </div>

  <!-- Interface de chat, affichée une fois connecté -->
  <div *ngIf="isConnected">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div>
        <h2 style="margin: 0;">Chat en direct — {{ senderName }} ({{ senderType }})</h2>
        <p style="color: #666; font-size: 12px; margin: 5px 0;">
          Session ID: <strong>{{ sessionId }}</strong>
          <button 
            (click)="copySessionId()" 
            style="margin-left: 10px; padding: 5px 10px; background-color: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;"
          >
            Copier
          </button>
        </p>
      </div>
      <div>
        <button 
          (click)="leave()" 
          style="background-color: #f44336; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;"
        >
          Quitter
        </button>
      </div>
    </div>

    <!-- Liste des messages -->
    <div style="border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background-color: #f9f9f9;">
      <div *ngFor="let msg of messages" style="margin-bottom: 12px; padding: 8px; background-color: white; border-left: 3px solid #2196F3; border-radius: 4px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
          <strong>{{ msg.senderName }}</strong>
          <span style="color: #999; font-size: 12px;">{{ msg.senderType }}</span>
        </div>
        <p style="margin: 0; color: #333;">{{ msg.content }}</p>
      </div>
      <div *ngIf="messages.length === 0" style="color: grey; text-align: center; padding: 20px;">
        Aucun message pour le moment... Soyez le premier à écrire !
      </div>
    </div>

    <!-- Champ d'envoi -->
    <div style="display: flex; gap: 5px;">
      <input
        [(ngModel)]="newMessage"
        placeholder="Votre message..."
        style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"
        (keyup.enter)="send()"
      />
      <button 
        (click)="send()" 
        style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;"
      >
        Envoyer
      </button>
    </div>
  </div>

</div>
